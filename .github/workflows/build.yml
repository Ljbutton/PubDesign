name: Build Windows installer

on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $j = Get-Content version.json -Raw | ConvertFrom-Json
          "version=$($j.version)" >> $env:GITHUB_OUTPUT
          Set-Content -Path notes.txt -Value $j.notes

      - name: Stop if this version is already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.ver.outputs.version }}" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Install build tools
        if: steps.check.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build PubDesign.exe
        if: steps.check.outputs.exists == 'false'
        run: pyinstaller --noconfirm pubdesign.spec

      - name: Self-test the built app
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\PubDesign\PubDesign.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed ($($p.ExitCode))"; exit 1 }

      - name: Build installer
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" "output\PubDesign-Setup.exe" `
            --repo $env:GITHUB_REPOSITORY --title "PubDesign ${{ steps.ver.outputs.version }}" `
            --notes-file notes.txt --latest
